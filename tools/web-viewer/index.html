<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terrainist — walkable world</title>
    <style>
      /*
       * The landing is a curtain over a page that is already running: the
       * canvas is mounted, the world is streaming, and all of this is on top
       * of it. Nothing here navigates, so nothing here has to be torn down and
       * rebuilt — the sequence is opacity and a little scale, and that is the
       * whole reason it can be slow enough to feel deliberate.
       *
       * The ease is one curve everywhere: cubic-bezier(0.16, 1, 0.3, 1), a fast
       * departure and a long settle. Mixing curves in a sequence this short is
       * what makes a fade read as cheap.
       */
      :root {
        color-scheme: dark;
        --ink: #dfe7ef;
        --dim: #8b98a8;
        --void: #05070a;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--void);
      }
      canvas {
        display: block;
      }

      /* the world's own fade-in, under the type */
      #veil {
        position: fixed;
        inset: 0;
        background: var(--void);
        pointer-events: none;
        opacity: 1;
        transition: opacity 1.9s var(--ease);
        z-index: 5;
      }

      #landing {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: var(--void);
        padding: 6vh 6vw;
        opacity: 1;
        transition:
          opacity 1.25s var(--ease),
          transform 1.6s var(--ease),
          filter 1.25s var(--ease);
      }
      #landing.lifting {
        opacity: 0;
        transform: scale(1.035);
        filter: blur(6px);
        pointer-events: none;
      }
      #landing .frame {
        width: min(64ch, 100%);
      }
      #landing-prompt {
        display: block;
        color: var(--ink);
        font-size: clamp(15px, 2.1vw, 21px);
        line-height: 1.75;
        letter-spacing: 0.01em;
        text-wrap: pretty;
        min-height: 1.75em;
      }
      /* the caret: a block that blinks while typing and stills when done */
      #landing-prompt::after {
        content: "";
        display: inline-block;
        width: 0.55em;
        height: 1.05em;
        margin-left: 0.12em;
        vertical-align: -0.16em;
        background: var(--ink);
        animation: blink 1.05s steps(1, end) infinite;
      }
      #landing-prompt.done::after {
        animation: none;
        opacity: 0.35;
      }
      @keyframes blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }
      #landing-status {
        display: block;
        margin-top: 2.4em;
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: lowercase;
        opacity: 0.55;
      }

      #enter-hint {
        position: fixed;
        left: 50%;
        bottom: 12vh;
        transform: translateX(-50%) translateY(8px);
        z-index: 4;
        padding: 9px 18px;
        border-radius: 999px;
        background: rgba(8, 11, 16, 0.42);
        backdrop-filter: blur(8px);
        color: var(--ink);
        font-size: 12px;
        letter-spacing: 0.08em;
        pointer-events: none;
        opacity: 0;
        transition:
          opacity 1.1s var(--ease),
          transform 1.1s var(--ease);
      }
      #enter-hint.shown {
        opacity: 0.86;
        transform: translateX(-50%) translateY(0);
      }

      #hud {
        position: fixed;
        left: 14px;
        bottom: 12px;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(12, 16, 22, 0.55);
        color: var(--ink);
        font-size: 12px;
        line-height: 1.6;
        letter-spacing: 0.02em;
        pointer-events: none;
        backdrop-filter: blur(6px);
        opacity: 0;
        transition: opacity 1.1s var(--ease);
        z-index: 4;
      }
      #hud.shown {
        opacity: 1;
      }
      #hud b {
        font-weight: 600;
        color: #fff;
      }
      #hud .dim {
        color: var(--dim);
      }
      #hud .hint {
        display: none;
      }
      #hud.unlocked .hint {
        display: block;
      }

      /* the licence the textures travel under; small, and not removable */
      #credits {
        position: fixed;
        right: 14px;
        bottom: 12px;
        z-index: 4;
        color: var(--dim);
        font-size: 10px;
        letter-spacing: 0.04em;
        opacity: 0.5;
      }
      #credits a {
        color: inherit;
      }

      @media (prefers-reduced-motion: reduce) {
        #veil,
        #landing,
        #hud,
        #enter-hint {
          transition-duration: 0.2s;
        }
        #landing-prompt::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="veil"></div>

    <div id="landing">
      <div class="frame">
        <span id="landing-prompt"></span>
        <span id="landing-status">loading</span>
      </div>
    </div>

    <div id="enter-hint">click to walk in</div>

    <div id="hud" class="unlocked">
      <div>
        <b id="hud-name">—</b>
        <span class="dim">· <span id="hud-mode">walk</span> · shaders
          <span id="hud-quality">ultra</span></span>
      </div>
      <div class="dim"><span id="hud-position">0 0 0</span></div>
      <div class="hint dim">
        click to look · WASD walk · space jump · ctrl sprint · shift sneak · G fly · U shaders ·
        esc release
      </div>
    </div>

    <div id="credits">
      textures:
      <a href="https://content.luanti.org/packages/MysticTempest/refi_textures/">RE:Fi</a>
      by MysticTempest,
      <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
